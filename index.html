<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 코드 스캐너 & 생성기</title>
    <meta name="description" content="모던 웹 기반 QR 코드 스캐너 및 생성기 - 카메라로 스캔하고, 커스텀 QR 코드 생성">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🔲 QR 코드 스캐너 & 생성기</h1>
            <p>Advanced QR Scanner & Generator</p>
        </header>

        <!-- Tabs -->
        <div class="tabs" role="tablist">
            <button class="tab-button active" role="tab" aria-selected="true"
                onclick="app.switchTab('scanner', event)">📷
                스캔 (Scan)</button>
            <button class="tab-button" role="tab" aria-selected="false" onclick="app.switchTab('generator', event)">✨ 생성
                (Create)</button>
        </div>

        <!-- Scanner Tab -->
        <div id="scanner" class="tab-content active">
            <div class="glass-card">
                <div class="control-bar">
                    <div class="camera-selector-wrapper">
                        <label for="cameraSelect" style="margin-right: 10px; color: var(--text-secondary);">카메라:</label>
                        <select id="cameraSelect" class="camera-select">
                            <option value="">카메라 검색 중...</option>
                        </select>
                    </div>
                    <div class="switch-container">
                        <span>자동 열기</span>
                        <label class="switch">
                            <input type="checkbox" id="autoOpen" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="status-badge" id="scanStatus">스캔 준비 완료</div>
                </div>

                <div class="video-container">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <div class="video-overlay" id="videoOverlay">
                        <p>카메라 접근 중...</p>
                    </div>
                </div>

                <div class="result-area">
                    <div class="result-text" id="resultText">스캔 중...</div>
                    <div class="action-buttons">
                        <button class="btn btn-secondary" id="copyBtn" disabled>📋 내용 복사</button>
                        <button class="btn btn-success" id="openBtn" disabled>🔗 링크 열기</button>
                        <button class="btn btn-secondary" id="resumeBtn" disabled>🔄 다시 스캔</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Generator Tab -->
        <div id="generator" class="tab-content">
            <div class="glass-card">
                <div class="form-group">
                    <label class="form-label">QR 코드 내용 입력</label>
                    <input type="text" class="form-input" id="qrInput" placeholder="https://example.com or any text...">
                </div>

                <div class="form-group">
                    <label class="form-label">옵션</label>
                    <div class="options-row">
                        <div class="color-picker-wrapper">
                            <label class="form-label" style="font-size: 0.9rem;">색상 선택 (Color)</label>
                            <input type="color" id="qrColor" value="#000000">
                        </div>
                        <div>
                            <label class="form-label" style="font-size: 0.9rem;">로고 추가 (Logo)</label>
                            <input type="file" id="logoInput" accept="image/*">
                            <label for="logoInput" class="file-upload-label" id="logoLabel">📁 파일 선택</label>
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary btn-full">✨ QR 코드 생성하기</button>

                <div class="preview-container" id="previewContainer">
                    <div class="preview-placeholder" id="previewPlaceholder">
                        <p>📱</p>
                        <p>내용을 입력하고 생성 버튼을 누르세요</p>
                    </div>
                    <img id="qrPreview" style="display: none;">
                </div>

                <div class="action-buttons">
                    <button class="btn btn-success btn-full" id="saveBtn" disabled>💾 이미지 저장</button>
                    <button class="btn btn-secondary btn-full" id="resetBtn">🔄 초기화</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Local Libraries -->
    <script src="js/lib/jsQR.js"></script>
    <script src="js/lib/qrcode.min.js"></script>

    <!-- Application Logic -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
